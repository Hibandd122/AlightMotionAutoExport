name: Build Tweak
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      profile:
        description: 'Startup A/B profile'
        required: true
        default: full
        type: choice
        options:
          - full
          - minimal
          - hooks

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: Setup iOS SDK
        run: |
          git clone -n --depth=1 --filter=tree:0 https://github.com/theos/sdks.git
          cd sdks
          git sparse-checkout set --no-cone iPhoneOS14.5.sdk
          git checkout
          mv iPhoneOS14.5.sdk ../theos/sdks/
          
      - name: Install Dependencies
        run: brew install ldid dpkg
          
      - name: Build Tweak
        run: |
          export THEOS=$GITHUB_WORKSPACE/theos
          profile="${{ inputs.profile || 'full' }}"
          case "$profile" in
            minimal) make_args="BUILD_B=1" ;;
            hooks) make_args="HOOKS=1" ;;
            full) make_args="" ;;
            *) echo "Unknown profile: $profile"; exit 2 ;;
          esac
          set +e
          make clean package FINALPACKAGE=1 V=1 $make_args 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          grep -E "error:|fatal error:|undefined reference|No rule to make" build.log | while IFS= read -r line; do
            echo "::error title=Theos build::$line"
          done
          exit $status
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tweak-DEB-${{ inputs.profile || 'full' }}
          path: |
            packages/*.deb
            build.log
