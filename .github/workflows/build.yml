name: Build Tweak
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Theos
        uses: actions/checkout@v4
        with:
          repository: theos/theos
          path: theos
          submodules: recursive

      - name: Setup iOS SDK
        run: |
          git clone -n --depth=1 --filter=tree:0 https://github.com/theos/sdks.git
          cd sdks
          git sparse-checkout set --no-cone iPhoneOS14.5.sdk
          git checkout
          mv iPhoneOS14.5.sdk ../theos/sdks/
          
      - name: Install Dependencies
        run: brew install ldid dpkg
          
      - name: Build Tweak
        run: |
          export THEOS=$GITHUB_WORKSPACE/theos
          set +e
          make package FINALPACKAGE=1 V=1 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          grep -E "error:|fatal error:|undefined reference|No rule to make" build.log | while IFS= read -r line; do
            echo "::error title=Theos build::$line"
          done
          exit $status
          
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Tweak-DEB
          path: packages/*.deb
